name: Deploy Operator Choice Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate frontend
        id: locate
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -name package.json -not -path '*/node_modules/*'
          FILE="$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | grep -m 1 -E '/frontend/package.json$|^\./package.json$')"
          if [ -z "$FILE" ]; then
            echo "Frontend package.json not found"
            exit 1
          fi
          DIR="$(dirname "$FILE")"
          echo "frontend_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found frontend at $DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefix "${{ steps.locate.outputs.frontend_dir }}"

      - name: Build frontend
        run: npm --prefix "${{ steps.locate.outputs.frontend_dir }}" run build
        env:
          CI: "false"
          PUBLIC_URL: /project1-main

      - name: Prepare Pages files
        shell: bash
        run: |
          mkdir -p public-site
          cp -R "${{ steps.locate.outputs.frontend_dir }}/build/." public-site/
          touch public-site/.nojekyll
          test -f public-site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
