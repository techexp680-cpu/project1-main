run: |
          mkdir -p public-site
          cp -R "${{ steps.locate.outputs.frontend_dir }}/build/." public-site/
          touch public-site/.nojekyll
          test -f public-site/index.html

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
